<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Venus CRM</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #f7f9fc;
    color: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0b0f; color: #eee; }
    p { color: #aaa; }
  }
  .panel { max-width: 420px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .logo {
    width: 44px; height: 44px; border-radius: 10px; background: #6366f1; color: white;
    display: grid; place-items: center; font-weight: 700; font-size: 20px;
  }
  h1 { font-size: 18px; margin: 4px 0 0; }
  p { font-size: 13px; color: #6b7280; margin: 0; line-height: 1.5; }
  button {
    margin-top: 6px; padding: 9px 22px; border-radius: 6px; border: none;
    background: #6366f1; color: white; font-weight: 600; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="logo">V</div>
    <h1>Can't reach Venus CRM right now</h1>
    <p>Check your internet connection. This page reconnects by itself every few seconds,
      and monitoring keeps running in the background.</p>
    <p id="detail"></p>
    <button id="retry" type="button">Try again now</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get("url");
    const reason = params.get("reason");
    if (reason) document.getElementById("detail").textContent = "(" + reason + ")";
    document.getElementById("retry").addEventListener("click", () => {
      if (target) location.href = target;
    });
  </script>
</body>
</html>
