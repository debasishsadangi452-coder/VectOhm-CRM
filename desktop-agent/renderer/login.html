<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Sign in to Venus CRM Monitor</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #0b0b0f;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  form { width: 280px; display: flex; flex-direction: column; gap: 10px; }
  input {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #16161c;
    color: #eee;
    font-size: 13px;
  }
  button {
    padding: 9px;
    border-radius: 6px;
    border: none;
    background: #6366f1;
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12px; color: #999; margin: 0 0 12px; }
  .error { color: #f87171; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
  <form id="login-form">
    <h1>Venus CRM Monitor</h1>
    <p>Sign in with your Venus CRM account. Screen recording is always on while
      you're signed in, per company policy.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
    <div class="error" id="error"></div>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const result = await window.omnios.login(email, password);

      if (!result.ok) {
        errorEl.textContent = result.error || "Sign in failed";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
      // On success the main process closes this window itself.
    });
  </script>
</body>
</html>
